        <main>
            <img src="imagenes/smartphone_connected_to_web.jpg" width="569" height="300" alt="">
            <h1>Contáctanos</h1>
            <p>¿Quieres continuar la conversación? Completa el siguiente formulario con tus datos de contacto y sigamos conversando.</p>
        
            <form action="confirmacion.html" method="get">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <br>
                <br>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>  
                <br>
                <br>

                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto">
                <br>
                <br>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje"></textarea>
                <br>
                <br>
            
                <button type="submit">Enviar</button>
            </form>
        </main>
